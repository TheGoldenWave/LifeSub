[package]
name = "lifesub"
version = "0.1.0"
description = "Local-first audio and transcript evidence manager"
edition = "2024"
build = "build.rs"

[lib]
name = "lifesub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
bzip2 = "0.5"
fs2 = "0.4.3"
libc = "0.2"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rubato = "5.0.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
sherpa-onnx = { version = "=1.13.5", default-features = false, features = ["static"], optional = true }
symphonia = { version = "0.6.1", features = ["aac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav"] }
tar = "0.4"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
unicode-normalization = "0.1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { version = "=0.9.2", default-features = false, features = ["metal"], optional = true }
qwen3-asr = { git = "https://github.com/alan890104/qwen3-asr-rs.git", rev = "c5ef09646af6278d2ba8b8ceaf543ffb32d1a5dc", version = "=0.2.2", default-features = false, features = ["metal"], optional = true }

[dev-dependencies]
tempfile = "3"
toml = "0.9"

[features]
default = []
asr-runtime = ["dep:sherpa-onnx"]
asr-qwen17-runtime = ["dep:qwen3-asr", "dep:candle-core"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-global-shortcut", "asr-runtime", "asr-qwen17-runtime"]

[[bin]]
name = "lifesub"
path = "src/main.rs"

[[bin]]
name = "lifesub-asr-gate"
path = "src/bin/lifesub-asr-gate.rs"
